# SWR SmartRoute - lighttpd 설정
# 정적 파일(/var/www/html, swr-web 패키지)은 lighttpd가 직접 서비스하고,
# /api 요청은 SmartRoute 앱의 QHttpServer(127.0.0.1:8080)로 프록시한다.
server.document-root = "/var/www/html"
server.port = 80
server.bind = "0.0.0.0"

server.username = "www-data"
server.groupname = "www-data"

server.modules = (
  "mod_proxy"
)

index-file.names = ( "index.html" )

mimetype.assign = (
    ".html" => "text/html",
    ".css"  => "text/css",
    ".js"   => "application/javascript",
    ".json" => "application/json",
    ".png"  => "image/png",
    ".jpg"  => "image/jpeg",
    ".svg"  => "image/svg+xml",
    ".ico"  => "image/x-icon",
    ".woff" => "font/woff",
    ".woff2" => "font/woff2",
    ""      => "application/octet-stream"
)

static-file.exclude-extensions = ( ".php", ".pl", ".fcgi" )

proxy.server = (
  "/api" => (( "host" => "127.0.0.1", "port" => 8080 ))
)
