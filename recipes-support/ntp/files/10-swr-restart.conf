# SmartRoute 앱(main.cpp applyNtpConfig)은 /etc/ntp.conf를 다시 쓴 뒤 ntpd에
# SIGHUP을 보내 "재로드"를 기대하지만, ntpd는 SIGHUP을 받으면 그냥 종료한다
# ("ntpd exiting on signal 1 (Hangup)" - 2026-10-13 실기기 확인: 앱 기동 1초 뒤
# ntpd가 inactive(dead)로 남았음). systemd가 종료를 감지하면 1초 뒤 다시 띄워
# 새 설정으로 재시작되게 한다 - 앱 쪽을 `systemctl restart ntpd`로 바꾸기 전까지의
# 이미지 측 보완이며, 바꾼 뒤에도 해가 없다.
[Service]
Restart=always
RestartSec=1
