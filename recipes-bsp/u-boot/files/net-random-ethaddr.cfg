# MAC 퓨즈(OCOTP)가 비어 있는 보드에서 U-Boot가 멈추지 않게 한다 (meta-sdr100 2026-10-08).
# 퓨즈가 비면 이더넷 장치 등록이 "No valid MAC address found"로 실패하고, 그 정리
# 과정에서 data abort -> 리셋을 반복했다(새 보드에서 UUU 플래싱 불가로 발견).
# 양산 보드는 퓨즈가 빈 상태로 들어와 플래싱 후 U-Boot에서 MAC을 기록하므로 필수.
# 퓨즈에 MAC이 있으면 퓨즈 값을 쓰고, 없을 때만 임시 무작위 MAC을 쓴다.
CONFIG_NET_RANDOM_ETHADDR=y
