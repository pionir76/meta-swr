# SWR SmartRoute: 디스플레이가 없는 보드 - 프레임버퍼 콘솔/부팅 로고/가상 콘솔 제거.
# 콘솔은 시리얼(console=ttymxc0)만 쓴다.
# VT는 tty0~63 등 약 85개 장치를 만들어 단일 코어에서 부팅 때 udev 처리를 늦춘다
# (meta-sdr100 2026-10-07 실측: udev 장치 395→305개). 시리얼 콘솔은 VT와 무관.
# 반영 방식은 rtc-rs5c372.cfg와 같이 DELTA_KERNEL_DEFCONFIG.
# CONFIG_FRAMEBUFFER_CONSOLE is not set
# CONFIG_FRAMEBUFFER_CONSOLE_DETECT_PRIMARY is not set
# CONFIG_LOGO is not set
# CONFIG_VT is not set
