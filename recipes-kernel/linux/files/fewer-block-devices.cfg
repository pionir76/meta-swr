# 부팅 시간 단축: 쓰지 않는 블록 장치를 만들지 않는다.
# 기본 커널은 램디스크 16개(/dev/ram0~15)와 loop 8개를 부팅 때 미리 만들고,
# udev가 블록 장치마다 규칙(blkid 등)을 실행해 단일 코어 528MHz에서 udev 처리가
# 약 30초 걸렸다(meta-sdr100 2026-10-07 실측, 블록 장치 25개 → 4개).
# - 램디스크: initrd를 쓰지 않으므로 불필요
# - loop: 기능은 남기고(필요할 때 /dev/loop-control로 자동 생성) 미리 만드는 개수만 0
# CONFIG_BLK_DEV_RAM is not set
CONFIG_BLK_DEV_LOOP_MIN_COUNT=0
