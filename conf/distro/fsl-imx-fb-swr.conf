# fsl-imx-fb-swr: NXP fsl-imx-fb 배포판에서 SWR SmartRoute 보드에 없는 기능을 뺀 것.
# (meta-sdr100의 fsl-imx-fb-lite와 같은 방식 - 2026-10-07 실기기 검증 결과를 따름)
#
# fsl-imx-fb는 EVK 기준이라 bluetooth/wifi/3g/nfc 등 하드웨어가 없는 기능과
# nfs/zeroconf, 모든 패키지의 테스트 스위트(ptest)까지 켜져 있다. 이 때문에 bluez,
# ofono, neard, avahi, rpcbind, wpa-supplicant 등이 이미지에 들어오고 부팅 때 실행되며,
# ptest 빌드로 빌드 시간도 길어진다. 헤드리스 보드라 alsa/opengl도 필요 없다
# (Qt는 QCoreApplication만 사용 - qtbase가 no-opengl로 빌드되어 mesa 의존이 빠진다).
#
# DISTROOVERRIDES는 fsl-imx-base.inc에서 "fsl"로 고정되므로 DISTRO 이름을 바꿔도
# NXP 레이어의 :fsl 조건부 설정은 그대로 적용된다.
#
# 사용: build 디렉토리 conf/local.conf에서 DISTRO = "fsl-imx-fb-swr"
require conf/distro/fsl-imx-fb.conf

DISTRO = "fsl-imx-fb-swr"

DISTRO_FEATURES:remove = "bluetooth wifi 3g nfc nfs zeroconf pcmcia pci ptest alsa opengl"
