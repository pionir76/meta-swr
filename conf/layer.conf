# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-swr"
BBFILE_PATTERN_meta-swr = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-swr = "6"

LAYERDEPENDS_meta-swr = "core"
LAYERSERIES_COMPAT_meta-swr = "walnascar"

# 호스트 커널 6.8 + pseudo openat2() 미인터셉트로 인한 tar/dpkg-deb do_package 실패 워크어라운드.
# 특정 레시피 국한 문제가 아니라 호스트 환경 전역 문제라 모든 레시피에 적용.
# 상세: classes/swr-pseudo-openat2-fix.bbclass
#
# 주의: layer.conf는 distro/defaultsetup.conf(PACKAGE_CLASSES->package_deb->
# package.bbclass를 상속시키는 곳)보다 먼저 파싱되므로, 여기서 INHERIT +=를
# 쓰면 이 클래스가 먼저 상속되고 이어서 package_deb가 perform_packagecopy를
# 다시 원본으로 덮어써버려 워크어라운드가 무효화된다.
# defaultsetup.conf가 "INHERIT += \"${PACKAGE_CLASSES} ${USER_CLASSES} ...\""
# 형태로 되어 있어 USER_CLASSES는 PACKAGE_CLASSES 바로 다음, 같은 문장에서
# 상속되므로 반드시 USER_CLASSES를 통해 추가해야 우리 쪽이 마지막에 이긴다.
USER_CLASSES:append = " swr-pseudo-openat2-fix"
