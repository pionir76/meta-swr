#@TYPE: Machine
#@NAME: SWR SmartRoute Gateway (i.MX6ULL)
#@SOC: i.MX6ULL
#@DESCRIPTION: Machine configuration for the SWR SmartRoute Modbus gateway board
#
# NXP EVK(imx6ull14x14evk) 머신 설정에서 분리한 전용 머신. SoC 공통 부분은
# meta-freescale의 imx-base.inc를 그대로 쓰고, 보드 고유 항목만 여기서 정한다.
# - 헤드리스(LCD/터치/오디오/무선 없음) -> 관련 MACHINE_FEATURES 전부 제외
# - 커널 DTB는 전용 imx6ull-swr.dts (recipes-kernel/linux/files/ 참고)
# - U-Boot는 EVK 보드 포팅(mx6ull_14x14_evk)을 그대로 사용 - DDR/부팅
#   경로가 EVK와 같아서 동작 확인된 상태. 기본 fdt_file만 전용 DTB로 바꿈
#   (recipes-bsp/u-boot/ 참고).

MACHINEOVERRIDES =. "mx6:mx6ul:mx6ull:"

include conf/machine/include/imx-base.inc
include conf/machine/include/arm/armv7a/tune-cortexa7.inc

# 첫 번째가 기본 DTB. 두 번째(순정 EVK DTB)는 복구용 - 전용 DTS에 문제가
# 생겨 부팅이 안 될 때 U-Boot에서 `setenv fdt_file imx6ull-14x14-evk.dtb;
# saveenv`로 바로 되돌릴 수 있게 boot 파티션에 같이 넣어둔다.
KERNEL_DEVICETREE = " \
    nxp/imx/imx6ull-swr.dtb \
    nxp/imx/imx6ull-14x14-evk.dtb \
"

UBOOT_CONFIG ??= "sd"
UBOOT_CONFIG[sd] = "mx6ull_14x14_evk_config,sdcard"

# imx-base.inc 기본값은 "usbgadget usbhost vfat alsa touchscreen screen".
# 보드에 LCD/터치/오디오/Wi-Fi/BT/OP-TEE가 없으므로 전부 뺀다 - 이 한 줄로
# bluetooth/ofono/wpa-supplicant/wireplumber/psplash 계열이 이미지에서 빠진다.
MACHINE_FEATURES = "usbgadget usbhost vfat"

# imx-base.inc 기본값 "kernel-modules"를 비움 - imx_v7_defconfig 기준 이
# 보드가 쓰는 드라이버(FEC, uSDHC, I2C, UART, RTC)는 전부 빌트인이고,
# 모듈로 빌드되는 것(ov5640 카메라, mx6s_capture 등)은 보드에 없는 장치뿐.
# 개발 이미지(swr-image-dev)에서는 필요 시 kernel-modules를 직접 넣는다.
MACHINE_EXTRA_RRECOMMENDS = ""

# tar.zst 아카이브는 호스트 tar/pseudo 문제로 항상 실패하고 플래싱에도
# 안 쓰므로 제외 (docs/testing-and-setup.md "빌드 환경 이슈" 참고).
IMAGE_FSTYPES:remove = "tar.zst"

hostname:pn-base-files = "smartroute"

# fsl-imx 배포판이 alsa DISTRO_FEATURE 때문에 imx-alsa-plugins를 다시
# 추천 목록에 넣는다 - 오디오 없는 보드라 제외.
MACHINE_EXTRA_RRECOMMENDS:remove = "imx-alsa-plugins"
